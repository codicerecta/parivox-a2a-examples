name: secret-scan

# Runs from the first commit. A credential, account id, ARN, or internal hostname
# that lands in git history cannot be undone by a later commit — it forces a history
# rewrite before this repository can ever be made public. Catching it at push time
# is the only cheap moment.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Pinned rather than :latest so a scanner update cannot silently change what
      # CI enforces. Bump deliberately.
      - name: Scan working tree and full history
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --redact --verbose --no-banner
